name: Deploy Classflow frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: classflow-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE != '' && vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS access with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ap-southeast-2
          role-session-name: classflow-frontend-${{ github.run_id }}

      - name: Verify the expected AWS account
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACTUAL_ACCOUNT" = "$EXPECTED_ACCOUNT"

      - name: Read CloudFormation outputs
        id: outputs
        env:
          STACK_NAME: classflow
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' --output json > /tmp/classflow-outputs.json
          output() {
            python - "$1" <<'PY'
          import json, sys
          values = {item['OutputKey']: item['OutputValue'] for item in json.load(open('/tmp/classflow-outputs.json'))}
          print(values[sys.argv[1]])
          PY
          }
          echo "bucket=$(output FrontendBucket)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(output DistributionId)" >> "$GITHUB_OUTPUT"

      - name: Publish immutable assets
        env:
          BUCKET: ${{ steps.outputs.outputs.bucket }}
        run: |
          aws s3 sync frontend/dist/ "s3://$BUCKET/" \
            --exclude 'index.html' --exclude 'config.js' \
            --cache-control 'public,max-age=31536000,immutable' \
            --delete

      - name: Publish entry point and runtime config
        env:
          BUCKET: ${{ steps.outputs.outputs.bucket }}
        run: |
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" \
            --cache-control 'no-cache' --content-type 'text/html'
          aws s3 cp frontend/public/config.js "s3://$BUCKET/config.js" \
            --cache-control 'no-cache' --content-type 'text/javascript'

      - name: Invalidate CloudFront entry point
        env:
          DISTRIBUTION: ${{ steps.outputs.outputs.distribution }}
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths /index.html /config.js

