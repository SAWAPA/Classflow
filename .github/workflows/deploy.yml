name: Deploy Classflow to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classflow-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ap-southeast-2
      STACK_NAME: classflow-classroom
      EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment settings
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing repository secret AWS_ACCESS_KEY_ID"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing repository secret AWS_SECRET_ACCESS_KEY"; exit 1; }
          test -n "$EXPECTED_ACCOUNT" || { echo "Missing repository variable AWS_ACCOUNT_ID"; exit 1; }
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "GOOGLE_CLIENT_SECRET is required when GOOGLE_CLIENT_ID is set"; exit 1
          fi
          if [ -z "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            echo "GOOGLE_CLIENT_ID is required when GOOGLE_CLIENT_SECRET is set"; exit 1
          fi
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "Google Login is disabled until GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are added"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: python -m unittest discover -s backend -v

      - run: node --test tests/auth.mjs

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - run: pip install boto3 cfn-lint

      - name: Package and validate the complete stack
        run: |
          python scripts/package.py
          cfn-lint -t build/classroom-stack.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the expected AWS account
        run: |
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACTUAL_ACCOUNT" = "$EXPECTED_ACCOUNT"

      - name: Deploy frontend, backend, and infrastructure
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: python scripts/deploy.py --stack "$STACK_NAME" --region "$AWS_REGION" --allow-account "$EXPECTED_ACCOUNT"
