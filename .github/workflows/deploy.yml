name: Deploy Classflow to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: classflow-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ap-southeast-2
      STACK_NAME: classflow-classroom
      EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment settings
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE }}
        run: |
          test -n "$DEPLOY_ROLE" || { echo "Missing repository variable AWS_DEPLOY_ROLE"; exit 1; }
          test -n "$EXPECTED_ACCOUNT" || { echo "Missing repository variable AWS_ACCOUNT_ID"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: python -m unittest discover -s backend -v

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - run: pip install boto3 cfn-lint

      - name: Package and validate the complete stack
        run: |
          python scripts/package.py
          cfn-lint -t build/classroom-stack.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: classflow-deploy-${{ github.run_id }}

      - name: Verify the expected AWS account
        run: |
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACTUAL_ACCOUNT" = "$EXPECTED_ACCOUNT"

      - name: Deploy frontend, backend, and infrastructure
        run: python scripts/deploy.py --stack "$STACK_NAME" --region "$AWS_REGION" --allow-account "$EXPECTED_ACCOUNT"
